<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Home Office — Wilden</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   WILDEN — HOME OFFICE
   The same civic-digital register as the rest of Wilden's services: flat, light,
   plain-spoken, with the accessibility furniture that comes with it.
   ═══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#0b0c0c; --crown:#0f2f33; --crownD:#0a2124;
  --grey1:#f3f2f1; --grey2:#e8e6e4; --grey3:#b1b4b6; --grey4:#505a5f;
  --green:#00703c; --greenD:#005a30; --greenL:#cce2d8;
  --blue:#1d70b8; --blueD:#003078; --blueL:#d2e2f1;
  --red:#d4351c; --redD:#942514; --redL:#f6d7d2;
  --teal:#1e857a; --tealL:#d4ebe8;
  --amber:#f47738; --amberL:#fcdccb;
  --focus:#ffdd00; --white:#fff;
}
html{font-size:100%;}
body{background:var(--white);color:var(--black);
  font-family:Inter,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
a:focus,button:focus,input:focus,select:focus,textarea:focus,[tabindex]:focus{
  outline:3px solid transparent;background-color:var(--focus)!important;color:var(--black)!important;
  box-shadow:0 -2px var(--focus),0 4px var(--black);text-decoration:none!important;}
.w{max-width:1020px;margin:0 auto;padding:0 15px;width:100%;}
.mono{font-variant-numeric:tabular-nums;}

.hdr{background:var(--crown);border-bottom:10px solid var(--crownD);}
.hdr .w{display:flex;align-items:center;gap:12px;padding:10px 15px;flex-wrap:wrap;}
.hdr .arms{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.hdr .arms img{max-width:100%;max-height:100%;object-fit:contain;}
.hdr .arms .fb{color:#fff;font-size:19px;}
.hdr a.brand{color:#fff;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.01em;}
.hdr a.brand:hover{text-decoration:underline;text-underline-offset:3px;}
.hdr .dept{color:#c9d6d8;font-size:15px;font-weight:600;border-left:1px solid #3a5b5e;padding-left:12px;}
.hdr .spacer{flex:1;}
.hdr .who{color:#c9d6d8;font-size:13px;text-align:right;line-height:1.3;}
.hdr .who b{color:#fff;display:block;font-weight:600;font-size:14px;}
.hdr .signout{background:none;border:0;color:#fff;font:inherit;font-size:14px;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;padding:4px 2px;}
.hdr .signin{background:var(--green);border:0;border-bottom:2px solid rgba(0,0,0,.28);color:#fff;
  font:inherit;font-weight:600;font-size:14px;padding:7px 14px;cursor:pointer;}

.nav{background:var(--crownD);}
.nav .w{display:flex;overflow-x:auto;padding:0 15px;}
.nav button{background:none;border:0;border-bottom:4px solid transparent;color:#c9d6d8;font:inherit;
  font-weight:600;font-size:15px;padding:12px 15px;cursor:pointer;white-space:nowrap;}
.nav button:hover{color:#fff;}
.nav button[aria-current="page"]{color:#fff;border-bottom-color:#fff;}

main{flex:1;padding:26px 0 46px;}
h1{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.11;margin-bottom:18px;}
h2{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:34px 0 14px;}
h3{font-size:18px;font-weight:700;line-height:1.25;margin:22px 0 8px;}
p{margin-bottom:14px;}
.lede{font-size:19px;line-height:1.55;margin-bottom:20px;max-width:640px;}
.hint{font-size:15px;color:var(--grey4);margin-bottom:12px;}
.caption{font-size:14px;color:var(--grey4);font-weight:600;margin-bottom:2px;}
a{color:var(--blue);text-underline-offset:2px;}
a:hover{color:var(--blueD);}
.rule{border:0;border-top:1px solid var(--grey3);margin:28px 0;}

.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;white-space:nowrap;}
.tag.blue{background:var(--blueL);color:var(--blueD);}
.tag.green{background:var(--greenL);color:#005a30;}
.tag.grey{background:var(--grey2);color:#383f43;}
.tag.red{background:var(--redL);color:#942514;}
.tag.amber{background:var(--amberL);color:#8b4415;}
.tag.teal{background:var(--tealL);color:#12564f;}

.btn{display:inline-block;font:inherit;font-weight:600;font-size:16px;padding:9px 16px;border:0;
  border-bottom:2px solid rgba(0,0,0,.28);background:var(--green);color:#fff;cursor:pointer;
  text-decoration:none;text-align:center;}
.btn:hover{background:var(--greenD);}
.btn.sec{background:var(--grey2);color:var(--black);border-bottom-color:#929191;}
.btn.sec:hover{background:#dbdad9;}
.btn.warn{background:var(--red);}
.btn.warn:hover{background:var(--redD);}
.btn.small{font-size:14px;padding:6px 12px;}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

.inset{border-left:10px solid var(--grey3);padding:12px 0 12px 18px;margin:18px 0;}
.inset.blue{border-left-color:var(--blue);}
.notif{border:5px solid var(--blue);margin-bottom:22px;}
.notif .head{background:var(--blue);color:#fff;padding:8px 15px;font-weight:700;font-size:15px;}
.notif .body{padding:14px 15px;}
.notif.ok{border-color:var(--green);}
.notif.ok .head{background:var(--green);}
.notif.warn{border-color:var(--red);}
.notif.warn .head{background:var(--red);}

.sl{border-top:1px solid var(--grey3);margin-bottom:20px;}
.sl .row{display:flex;gap:16px;border-bottom:1px solid var(--grey3);padding:11px 0;flex-wrap:wrap;}
.sl .k{font-weight:700;width:210px;flex-shrink:0;}
.sl .v{flex:1;min-width:180px;}

table{width:100%;border-collapse:collapse;margin-bottom:20px;}
caption{text-align:left;font-weight:700;font-size:18px;margin-bottom:10px;}
th,td{text-align:left;padding:10px 14px 10px 0;border-bottom:1px solid var(--grey3);vertical-align:top;font-size:15px;}
th{font-weight:700;}
thead th{border-bottom:1px solid var(--black);}

.grid{display:grid;gap:18px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));}
.card{border:1px solid var(--grey3);border-top:4px solid var(--teal);padding:16px 18px;background:var(--white);}
.card.muted{border-top-color:var(--grey3);background:#fafafa;}
.card h3{margin-top:0;}
.stat{border:1px solid var(--grey3);padding:14px 16px;}
.stat .n{font-size:32px;font-weight:700;line-height:1.05;letter-spacing:-.02em;}
.stat .l{font-size:14px;color:var(--grey4);margin-top:3px;}

.person{display:flex;gap:12px;align-items:center;}
.person img{width:40px;height:40px;image-rendering:pixelated;border:1px solid var(--grey3);flex-shrink:0;}
.person .nm{font-weight:600;line-height:1.3;}
.person .un{font-size:13px;color:var(--grey4);}
.vacant{color:var(--grey4);font-style:italic;}

label{display:block;font-weight:600;margin-bottom:5px;}
input[type=text],input[type=password],input[type=date],textarea,select{
  width:100%;font:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--black);background:#fff;color:var(--black);}
textarea{line-height:1.55;resize:vertical;}
.field{margin-bottom:18px;max-width:520px;}
.field .hint{margin-bottom:6px;}
.err{border-left:5px solid var(--red);padding:12px 0 12px 14px;margin-bottom:18px;}
.err .t{font-weight:700;color:var(--red);}

.subnav{display:flex;gap:0;border-bottom:1px solid var(--grey3);margin-bottom:22px;overflow-x:auto;}
.subnav button{background:none;border:0;border-bottom:4px solid transparent;font:inherit;font-weight:600;
  font-size:15px;color:var(--blue);padding:9px 14px;cursor:pointer;white-space:nowrap;}
.subnav button[aria-current="true"]{color:var(--black);border-bottom-color:var(--black);}

/* the warrant card — the one place this service raises its voice */
.warrant{border:1px solid var(--red);border-left:10px solid var(--red);padding:12px 16px;margin-bottom:10px;background:#fff8f7;}

/* identity card, in the flat civic register rather than a foil-and-guilloche one */
.idcard{border:1px solid var(--grey3);border-top:6px solid var(--crown);background:#fafafa;padding:16px 18px;max-width:420px;}
.idcard .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  border-bottom:1px solid var(--grey3);padding-bottom:8px;margin-bottom:12px;}
.idcard .realm{font-weight:800;font-size:15px;letter-spacing:-.01em;}
.idcard .kind{font-size:12px;color:var(--grey4);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.idcard .no{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;}

.ftr{border-top:1px solid var(--grey3);background:var(--grey1);padding:22px 0 26px;margin-top:auto;}
.ftr .w{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end;}
.ftr .lic{font-size:14px;color:var(--grey4);max-width:480px;}

.overlay{position:fixed;inset:0;z-index:9000;background:rgba(11,12,12,.6);display:flex;align-items:center;justify-content:center;padding:15px;}
.modal{background:#fff;padding:24px;max-width:420px;width:100%;}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9500;
  background:var(--black);color:#fff;padding:12px 20px;font-weight:600;font-size:15px;max-width:90vw;}
.toast.bad{background:var(--red);}
.busy{position:fixed;inset:0;z-index:9800;background:rgba(255,255,255,.86);display:flex;align-items:center;justify-content:center;font-weight:700;}

/* ── passport flip-book (mirrors the issuing service's own viewer) ────────── */
.bk-overlay{position:fixed;inset:0;z-index:9990;background:rgba(8,12,14,.95);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:1rem;overflow-y:auto;}
.bk-stage{--ppw:300px;--pph:420px;perspective:2200px;position:relative;width:calc(var(--ppw)*2);height:var(--pph);
  transition:transform .8s cubic-bezier(.45,.05,.2,1);flex-shrink:0;}
@media(max-width:700px){.bk-stage{--ppw:210px;--pph:294px;}}
.bk-stage.closed{transform:translateX(calc(var(--ppw)/-2));}
.bk-stage.closed-end{transform:translateX(calc(var(--ppw)/2));}
.bk-sheet{position:absolute;top:0;right:0;width:var(--ppw);height:var(--pph);transform-origin:left center;
  transform-style:preserve-3d;transition:transform .85s cubic-bezier(.45,.05,.2,1);cursor:pointer;}
.bk-sheet.flipped{transform:rotateY(-180deg);}
.bk-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  border-radius:5px 14px 14px 5px;box-shadow:0 16px 44px rgba(0,0,0,.5);}
.bk-face.back{transform:rotateY(180deg);border-radius:14px 5px 5px 14px;}
.bk-paper{position:absolute;inset:0;background:
  radial-gradient(ellipse 120% 90% at 50% -20%, rgba(80,110,160,.06), transparent 60%),
  repeating-radial-gradient(circle at 50% 50%, transparent 0px, transparent 9px, rgba(90,80,120,.03) 10px),
  linear-gradient(160deg,#f2ecdc 0%,#e9e1cd 55%,#ded3b8 100%);
  box-shadow:inset 0 0 34px rgba(90,70,40,.2);}
@keyframes bkStamp{0%{opacity:0;transform:rotate(-13deg) scale(1.6);}60%{opacity:1;transform:rotate(-13deg) scale(.94);}100%{opacity:1;transform:rotate(-13deg) scale(1);}}
.bk-revoked{animation:bkStamp .5s ease .45s both;}
.bk-close{position:absolute;top:16px;right:20px;background:transparent;border:1px solid #6b7a7d;color:#c9d6d8;
  width:34px;height:34px;cursor:pointer;font-size:15px;}
.bk-nav{margin-top:24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;color:#c9d6d8;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo}=React;

/* ═══════════════════════════════════════════════════════════════════════════
   WILDEN — HOME OFFICE
   The department of state responsible for the interior: national identity cards,
   and the Royal Wilden Constabulary. Built on the same pattern as the Republic's
   Department of Justice, but under a Secretary of State rather than an Attorney
   General, and with a single police service rather than several agencies.

   Authority is read, never re-entered. The Secretary of State for Home Affairs
   is whoever holds that department in the Wilden Cabinet (wx_gov); everyone else
   — the Chief Constable, the deputies, and the whole roster — is appointed here.
   ═══════════════════════════════════════════════════════════════════════════ */

const uid=()=>Date.now()+"_"+Math.random().toString(36).slice(2,8);
const lc=s=>String(s||"").toLowerCase();
function fmtDate(d){if(d===undefined||d===null||d==="")return "—";const s=(typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d))?d+"T12:00:00":d;const t=typeof s==="number"?s:new Date(s).getTime();if(isNaN(t))return ""+d;return new Date(t).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}
const mcFaceUrl=n=>"https://mc-heads.net/avatar/"+encodeURIComponent(n||"")+"/80";

/* ── backend (shared session) ────────────────────────────────────────────── */
const API="https://lech-backend.onrender.com";
let AUTH_TOKEN=null;
const SESSION_KEY="lech_session",SESSION_ACC_KEY="lech_session_acc";
function saveSession(t,acc){try{if(t)localStorage.setItem(SESSION_KEY,t);if(acc)localStorage.setItem(SESSION_ACC_KEY,JSON.stringify(acc));}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_ACC_KEY);}catch(e){}AUTH_TOKEN=null;}
function forgetSession(){const t=AUTH_TOKEN;clearSession();try{if(t)fetch(API+"/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t})});}catch(e){}}
async function srestore(){let t=null;try{t=localStorage.getItem(SESSION_KEY);}catch(e){}if(!t)return null;AUTH_TOKEN=t;try{const r=await fetch(API+"/api/me?token="+encodeURIComponent(t));const d=await r.json();if(d&&d.ok&&d.account){saveSession(t,d.account);return d.account;}clearSession();return null;}catch(e){return null;}}
async function sgetAll(){try{const r=await fetch(API+"/api/data"+(AUTH_TOKEN?"?token="+encodeURIComponent(AUTH_TOKEN):""));const d=await r.json();return (d&&d.ok)?(d.data||{}):{};}catch{return{};}}
async function sset(k,v){try{const r=await fetch(API+"/api/set",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:AUTH_TOKEN,key:k,value:v})});const d=await r.json();return (d&&d.ok)?{ok:true}:{ok:false,error:(d&&d.error)||"Refused."};}catch{return {ok:false,error:"Connection error."};}}
async function slogin(username,password){try{const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:String(username||"").trim(),password})});const d=await r.json();if(d&&d.ok){AUTH_TOKEN=d.token;saveSession(d.token,d.account);return {ok:true,account:d.account};}return {ok:false,error:(d&&d.error)||"ACCESS DENIED"};}catch(e){return {ok:false,error:"Connection error"};}}

/* ── the Constabulary ─────────────────────────────────────────────────────── */
const CONSTABULARY={
  id:"rwc",
  name:"Royal Wilden Constabulary",
  short:"RWC",
  logo:"wildenconst.png",
  headTitle:"Chief Constable",
  deputyTitle:"Deputy Chief Constable",
  maxDeputies:2,
  blurb:"The police service of Wilden. Keeps the King's peace, investigates offences and executes warrants.",
};
const DEFAULT_RANKS=["Constable","Sergeant","Inspector","Chief Inspector","Superintendent"];
function ranksOf(agency){
  const r=agency&&agency.ranks;
  if(r&&r.length)return r;
  return DEFAULT_RANKS.map(n=>({id:lc(n).replace(/[^a-z]+/g,"_"),name:n}));
}
const REC_META={arrest:{l:"Arrest",tag:"red"},ticket:{l:"Fixed penalty",tag:"amber"},warning:{l:"Caution",tag:"grey"}};

/* ── standing ─────────────────────────────────────────────────────────────── */
// The department is administered by the Secretary of State for Home Affairs,
// read from the Cabinet — never designated here. The older "Minister of Home
// Affairs" title resolves to the same department.
const HOME_DEPTS=["secretary of state for home affairs","minister of home affairs"];
const isAdminAcct=u=>!!u&&(u.role==="emperor"||u.sysAdmin===true);
const wxRole=u=>String((u&&u.wxRole)||"");
const isSovereign=u=>wxRole(u)==="sovereign";
const isPM=u=>wxRole(u)==="pm";
function homeSecretary(gov){
  const cab=(gov&&gov.cabinet)||{};
  const k=Object.keys(cab).find(u=>HOME_DEPTS.includes(String(cab[u]||"").trim().toLowerCase()));
  return k?lc(k):"";
}
const isHomeSec=(u,gov)=>!!u&&!!homeSecretary(gov)&&lc(u.username)===homeSecretary(gov);
// Those who direct the Home Office without being appointed into it.
const homeAdmin=(u,gov)=>isAdminAcct(u)||isSovereign(u)||isPM(u)||isHomeSec(u,gov);
const agencyOf=home=>(home&&home.agencies&&home.agencies[CONSTABULARY.id])||{};
const isHead=(u,ag)=>!!u&&lc(ag.head||"")===lc(u.username);
const isDeputy=(u,ag)=>!!u&&(ag.deputies||[]).some(d=>lc(d)===lc(u.username));
const rosterRankOf=(ag,u)=>(ag.roster||{})[lc(u&&u.username)]||null;
const inAgency=(u,ag)=>isHead(u,ag)||isDeputy(u,ag)||!!rosterRankOf(ag,u);
const canEnter=(u,gov,home)=>homeAdmin(u,gov)||inAgency(u,agencyOf(home));
const canManage=(u,gov,home)=>homeAdmin(u,gov)||isHead(u,agencyOf(home));

/* ── person helpers ───────────────────────────────────────────────────────── */
const acctByName=(accounts,uname)=>accounts.find(a=>lc(a.username)===lc(uname))||null;
function titleFor(home,username){
  const ag=agencyOf(home);
  if(lc(ag.head||"")===lc(username))return CONSTABULARY.headTitle;
  if((ag.deputies||[]).some(d=>lc(d)===lc(username)))return CONSTABULARY.deputyTitle;
  const rid=(ag.roster||{})[lc(username)];
  if(rid){const r=ranksOf(ag).find(x=>x.id===rid);return r?r.name:"Constable";}
  return null;
}
// Only a citizen of Wilden may be appointed. The person already holding a place
// stays selectable so they can be seen and replaced, never silently dropped.
function citizenOpts(accounts,citizens,{exclude=[],current="",emptyLabel="— Vacant —",noneLabel="No eligible citizens"}={}){
  const ex=new Set(exclude.map(lc).filter(Boolean));
  let pool=accounts.filter(a=>citizens.has(lc(a.username))&&!ex.has(lc(a.username)))
    .sort((a,b)=>String(a.displayName||a.username||"").localeCompare(String(b.displayName||b.username||"")))
    .map(a=>({v:a.username,l:(a.displayName?a.displayName+" ":"")+"@"+a.username}));
  if(current&&!pool.some(o=>lc(o.v)===lc(current))){
    const a=accounts.find(x=>lc(x.username)===lc(current));
    pool=[{v:current,l:(a?((a.displayName?a.displayName+" ":"")+"@"+a.username):("@"+current))+" (current)"},...pool];
  }
  return [{v:"",l:pool.length?emptyLabel:"— "+noneLabel+" —"},...pool];
}

/* ── UI atoms (Wilden's register) ─────────────────────────────────────────── */
function Tag({t,children}){return <span className={"tag "+(t||"grey")}>{children}</span>;}
function Btn({children,onClick,kind,small,disabled,type}){
  return <button type={type||"button"} className={"btn"+(kind?" "+kind:"")+(small?" small":"")}
    disabled={disabled} onClick={disabled?undefined:onClick}>{children}</button>;
}
function ArmBtn({label,confirmLabel,onConfirm,small}){
  const [a,setA]=useState(false);
  useEffect(()=>{if(!a)return;const t=setTimeout(()=>setA(false),4000);return()=>clearTimeout(t);},[a]);
  return a?<Btn kind="warn" small={small} onClick={()=>{setA(false);onConfirm();}}>{confirmLabel||"Confirm"}</Btn>
    :<Btn kind="sec" small={small} onClick={()=>setA(true)}>{label}</Btn>;
}
function Field({label,hint,children}){
  return <div className="field"><label>{label}</label>{hint&&<div className="hint">{hint}</div>}{children}</div>;
}
function Empty({children}){return <p className="hint" style={{marginTop:12}}>{children}</p>;}
function Stat({n,l}){return <div className="stat"><div className="n">{n}</div><div className="l">{l}</div></div>;}
function Notif({title,children,kind}){
  return <div className={"notif"+(kind?" "+kind:"")}><div className="head">{title}</div><div className="body">{children}</div></div>;
}
function Person({account,size=40,office}){
  if(!account)return <span className="vacant">Vacant</span>;
  const n=account.mcName||account.username;
  return <span className="person">
    <img src={mcFaceUrl(n)} alt="" width={size} height={size} loading="lazy"
      onError={e=>{e.currentTarget.style.visibility="hidden";}} style={{width:size,height:size}}/>
    <span><span className="nm">{account.displayName||account.username}</span>
      {account.displayName&&<span className="un">{account.username}</span>}
      {office&&<span className="un">{office}</span>}</span>
  </span>;
}
function Badge({file,size=44,alt}){
  const [ok,setOk]=useState(true);
  if(!file||!ok)return null;
  return <img src={file} alt={alt||""} onError={()=>setOk(false)}
    style={{width:size,height:size,objectFit:"contain",flexShrink:0}}/>;
}
function Sel({value,onChange,options}){
  return <select value={value} onChange={e=>onChange(e.target.value)}>
    {options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select>;
}

/* ── identity card ────────────────────────────────────────────────────────── */
function idNumber(username){
  let h=2166136261;const s=lc(username);
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0;}
  const six=(h%900000)+100000;

}
/* The national identity card. Wilden issues centrally — there are no provinces
   or states to letter it for — so the card carries the Realm's own livery, the
   Royal Arms watermarked across the field, and a guilloche ground, in the same
   register as the Empire's provincial card and the Republic's State card. */
const ID_LIVERY={c1:"#14343a",c2:"#07181b",foil:"#dcc488",ink:"#eef5f4"};
function guillochePath(cx,cy,rad,petals,depth,copies){
  let d="";const TAU=Math.PI*2,S=100;
  for(let j=0;j<copies;j++){
    const ph=j*TAU/(petals*copies);
    for(let i=0;i<=S;i++){
      const t=i/S*TAU,rr=rad*(1-depth+depth*Math.cos(petals*t)),a=t+ph;
      d+=(i?"L":"M")+(cx+rr*Math.cos(a)).toFixed(1)+" "+(cy+rr*Math.sin(a)).toFixed(1)+" ";
    }
  }
  return d;
}
function mrzClean(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9 ]/g,"").trim().replace(/ +/g,"<");}
function mrzPad(s,n){return (s+"<".repeat(n)).slice(0,n);}
function mrzDate(d){if(!d)return "<<<<<<";const t=new Date(d);if(isNaN(t.getTime()))return "<<<<<<";const p=x=>String(x).padStart(2,"0");return String(t.getFullYear()).slice(2)+p(t.getMonth()+1)+p(t.getDate());}
function IdCard({card,face}){
  const S=ID_LIVERY;

  const revoked=String(card.status||"")==="revoked";
  const l1=mrzPad("IDWLD"+mrzClean(card.number)+"<<"+mrzClean(card.username||""),36);
  const l2=mrzPad(mrzDate(card.issued)+"<WLD<"+mrzDate(card.expires),36);

        <path d={guillochePath(206,124,120,13,0.13,16)}/>

function SignIn({onClose,onAuth}){
  const [u,setU]=useState("");const [p,setP]=useState("");const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const go=async()=>{
    if(busy)return;
    if(!u.trim()||!p){setErr("Enter your username and password.");return;}
    setBusy(true);setErr("");
    const res=await slogin(u,p);
    if(!res.ok){setErr(res.error==="ACCESS DENIED"?"Those details were not recognised.":res.error);setBusy(false);return;}
    onAuth(res.account);
  };
  return <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <h2 style={{marginTop:0}}>Sign in</h2>
      {err&&<div className="err"><div className="t">There is a problem</div><div>{err}</div></div>}
      <Field label="Username"><input type="text" value={u} onChange={e=>setU(e.target.value)} autoComplete="username"/></Field>
      <Field label="Password"><input type="password" value={p} onChange={e=>setP(e.target.value)} autoComplete="current-password"
        onKeyDown={e=>{if(e.key==="Enter")go();}}/></Field>
      <div className="btn-row">
        <Btn onClick={go} disabled={busy}>{busy?"Signing in…":"Sign in"}</Btn>
        <Btn kind="sec" onClick={onClose}>Cancel</Btn>
      </div>
      <p className="hint" style={{marginTop:14,marginBottom:0}}>
        One account for the whole network. Register on the <a href="index.html">Vintranet</a>.</p>
    </div>
  </div>;
}

function IssueId({accounts,citizens,ids,onAction,notify,setBusy}){

  </div>;

/* ── look-up (the constable's terminal) ───────────────────────────────────── */
// This terminal is Wilden's, so Wilden is "domestic" and everything else foreign.
const HOME_NATION="wilden";
function RecordTable({rows,foreign}){
  return <table>
    <thead><tr><th>Type</th><th>Particulars</th><th>{foreign?"Jurisdiction":"Officer"}</th><th>Date</th></tr></thead>
    <tbody>{rows.map(r=>{const m=REC_META[r.type]||{l:r.type||"Record",tag:"grey"};
      return <tr key={r.id}>
        <td><Tag t={foreign?"grey":m.tag}>{m.l}</Tag></td>
        <td><b>{r.charge||r.reason||"—"}</b>
          {r.notes&&<div className="hint" style={{marginBottom:0}}>{r.notes}</div>}
          {r.location&&<div className="hint" style={{marginBottom:0}}>{r.location}</div>}</td>
        <td>{foreign?r.nationLabel:(r.officerName||"—")}</td>
        <td>{fmtDate(r.at)}</td>
      </tr>;})}</tbody>
  </table>;
}
function Lookup({accounts,dossier}){
  const [q,setQ]=useState("");
  const [sel,setSel]=useState(null);
  const [book,setBook]=useState(null);
  const s=lc(q).trim();
  const hits=s?accounts.filter(a=>lc(a.username).includes(s)||lc(a.displayName||"").includes(s)).slice(0,8):[];
  const person=sel?acctByName(accounts,sel):null;
  const u=person?lc(person.username):"";
  const D=dossier||{};
  const citizenships=person?(D.citizenships||[]).filter(c=>lc(c.username)===u):[];
  const cards=person?(D.ids||[]).filter(c=>lc(c.username)===u)
    .sort((a,b)=>(a.nation===HOME_NATION?-1:0)-(b.nation===HOME_NATION?-1:0)):[];
  const passes=person?(D.passports||[]).filter(p=>lc(p.username)===u):[];
  const allRecs=person?(D.records||[]).filter(r=>lc(r.subject)===u).sort((a,b)=>(b.at||0)-(a.at||0)):[];
  const domestic=allRecs.filter(r=>r.nation===HOME_NATION);
  const foreign=allRecs.filter(r=>r.nation!==HOME_NATION);
  const wars=person?(D.warrants||[]).filter(w=>lc(w.username)===u&&w.status==="active"):[];
  return <div>
    <h2>Look-up</h2>
    <p className="hint">Search a person to see their citizenship, documents, record and any warrant in force —
      across every nation on the network.</p>
    <Field label="Search"><input type="text" value={q} onChange={e=>{setQ(e.target.value);setSel(null);}}
      placeholder="Name or username"/></Field>
    {s&&!sel&&(hits.length===0?<Empty>Nobody of that name.</Empty>
      :<div className="grid g3" style={{marginBottom:20}}>
        {hits.map(a=><div key={a.username} className="card muted" style={{cursor:"pointer"}}
          onClick={()=>{setSel(a.username);setQ(a.displayName||a.username);}}><Person account={a}/></div>)}
      </div>)}

    {person&&<div>
      <hr className="rule"/>
      {wars.map((w,i)=><div key={i} className="warrant">
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <Tag t="red">Warrant in force</Tag>
          <b style={{flex:1,minWidth:140}}>{w.reason||"Warrant"}</b>
          <span className="hint" style={{margin:0}}>{w.nationLabel} · {fmtDate(w.at)}</span>
        </div>
        {w.issuedByName&&<p className="hint" style={{marginBottom:0,marginTop:6}}>Issued by {w.issuedByName}</p>}
      </div>)}
      <h3>{person.displayName||person.username}</h3>

      <h2>Citizenship</h2>
      {citizenships.length===0?<Empty>Holds no recorded citizenship.</Empty>
        :<div className="grid g3">
          {citizenships.map((c,i)=><div key={i} className={"card"+(c.nation===HOME_NATION?"":" muted")}>
            <h3 style={{marginTop:0,marginBottom:4}}>{c.nationLabel}</h3>
            <div className="caption">{String(c.status||"citizen").toUpperCase()}
              {c.since?" · SINCE "+String(c.since).toUpperCase():""}</div>
            {c.nation===HOME_NATION&&<div style={{marginTop:6}}><Tag t="green">Domestic</Tag></div>}
          </div>)}
        </div>}

      <h2>Identity cards</h2>
      {cards.length===0?<Empty>No identity card on file in any nation.</Empty>
        :cards.map((c,i)=><div key={i} style={{marginBottom:18}}>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:7,flexWrap:"wrap"}}>
            <span className="caption" style={{marginBottom:0}}>{c.nationLabel.toUpperCase()}</span>
            {c.nation===HOME_NATION?<Tag t="green">Domestic</Tag>:<Tag t="grey">Foreign</Tag>}
          </div>
          {c.nation===HOME_NATION
            ?<IdCard card={c} face={mcFaceUrl(person.mcName||person.username)}/>
            :<div className="card muted" style={{maxWidth:430}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
                <b>{c.name||c.username}</b>
                <span className="mono">{c.number||"—"}</span>
              </div>
              <div className="hint" style={{marginBottom:0,marginTop:4}}>
                {c.state?String(c.state)+" · ":""}Issued {fmtDate(c.issued)} · Expires {fmtDate(c.expires)}</div>
              <div style={{marginTop:8}}>
                {String(c.status||"")==="revoked"?<Tag t="red">Revoked</Tag>
                  :(c.expires&&new Date(String(c.expires)+"T23:59:59").getTime()<Date.now())
                    ?<Tag t="red">Expired</Tag>:<Tag t="green">Valid</Tag>}
              </div>
            </div>}
        </div>)}

      <h2>Travel documents</h2>
      {passes.length===0?<Empty>No passport on file in any nation.</Empty>
        :<div className="grid g2">
          {passes.map((p,i)=>{const nat=ppNationOf(p.nation);const t=ppTypeOf(nat,p.type);const vv=ppValidity(p);
            return <div key={i} className="card" style={{cursor:"pointer",borderTopColor:t.trim}}
              onClick={()=>setBook({passport:p,nationKey:p.nation,visas:p._visas})}>
              <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap",alignItems:"baseline"}}>
                <h3 style={{margin:0}}>{nat.label}</h3>
                <span className="mono">{p.number}</span>
              </div>
              <div className="hint" style={{marginBottom:6,marginTop:4}}>
                {t.l} · expires {fmtDate(p.expires)}</div>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                <Tag t={vv.tag}>{vv.label}</Tag>
                <span className="caption" style={{marginBottom:0}}>OPEN PASSPORT →</span>
              </div>
            </div>;})}
        </div>}

      <h2>Criminal record</h2>
      {allRecs.length===0?<Empty>No record held in any nation.</Empty>
        :<>
          <div className="caption" style={{marginBottom:8}}>DOMESTIC — WILDEN ({domestic.length})</div>
          {domestic.length===0?<Empty>No domestic record.</Empty>:<RecordTable rows={domestic}/>}
          <div className="caption" style={{marginBottom:8}}>FOREIGN OFFENCES ({foreign.length})</div>
          {foreign.length===0?<Empty>No offence recorded abroad.</Empty>:<RecordTable rows={foreign} foreign/>}
        </>}
    </div>}
    {book&&<PassportBook passport={book.passport} nationKey={book.nationKey}
      visas={book.visas} onClose={()=>setBook(null)}/>}
  </div>;
}

/* ── enforcement ──────────────────────────────────────────────────────────── */
function Enforcement({user,accounts,records,warrants,onAction,notify,setBusy}){
  const [type,setType]=useState("arrest");
  const [subj,setSubj]=useState("");const [charge,setCharge]=useState("");
  const [location,setLocation]=useState("");const [fine,setFine]=useState("");
  const [notes,setNotes]=useState("");const [warrant,setWarrant]=useState(false);const [saving,setSaving]=useState(false);
  // A record may be made against anyone present in Wilden, citizen or not, so
  // this list is deliberately the whole directory rather than the citizen roll.
  const opts=[{v:"",l:"— Select a person —"},...accounts
    .sort((a,b)=>String(a.displayName||a.username||"").localeCompare(String(b.displayName||b.username||"")))
    .map(a=>({v:a.username,l:(a.displayName?a.displayName+" ":"")+"@"+a.username}))];
  const recent=Object.values(records||{}).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,30);
  const active=Object.values(warrants||{}).filter(w=>w&&w.status==="active").sort((a,b)=>(b.at||0)-(a.at||0));
  return <div>
    <h2>Record an action</h2>
    <div className="btn-row" style={{marginBottom:16}}>
      {["arrest","ticket","warning"].map(t=>(
        <Btn key={t} small kind={type===t?undefined:"sec"} onClick={()=>setType(t)}>{REC_META[t].l}</Btn>))}
    </div>
    <div style={{maxWidth:560}}>
      <Field label="Person"><Sel value={subj} onChange={setSubj} options={opts}/></Field>
      <Field label={type==="ticket"?"Offence":type==="warning"?"Reason":"Charge"}>
        <input type="text" value={charge} onChange={e=>setCharge(e.target.value)}
          placeholder={type==="ticket"?"e.g. Speeding":type==="arrest"?"e.g. Burglary":"e.g. Trespass — cautioned"}/></Field>
      <Field label="Location"><input type="text" value={location} onChange={e=>setLocation(e.target.value)} placeholder="Where it happened"/></Field>
      {type==="ticket"&&<Field label="Penalty"><input type="text" value={fine} onChange={e=>setFine(e.target.value)} placeholder="e.g. £250"/></Field>}
      <Field label="Notes"><textarea rows={2} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Narrative"/></Field>
      {type==="arrest"&&<div className="field">
        <label style={{display:"flex",gap:10,alignItems:"center",fontWeight:400}}>
          <input type="checkbox" checked={warrant} onChange={e=>setWarrant(e.target.checked)}
            style={{width:"auto",border:"2px solid var(--black)"}}/>
          Also issue a warrant for this person
        </label>
      </div>}
      <Btn disabled={!subj||!charge.trim()||saving} onClick={async()=>{
        setSaving(true);setBusy("Filing");
        const a=acctByName(accounts,subj);
        const rec={id:"whr_"+uid(),type,subject:lc(subj),subjectName:a?(a.displayName||a.username):subj,
          officer:lc(user.username),officerName:user.displayName||user.username,
          charge:charge.trim(),location:location.trim(),fine:fine.trim(),notes:notes.trim(),at:Date.now()};
        const res=await onAction("logRecord",rec);
        if(res.ok&&type==="arrest"&&warrant){
          await onAction("issueWarrant",{id:"whw_"+uid(),username:lc(subj),subjectName:rec.subjectName,
            reason:charge.trim(),issuedBy:lc(user.username),issuedByName:rec.officerName,at:Date.now(),status:"active"});
        }
        setBusy(null);setSaving(false);
        if(res.ok){notify(REC_META[type].l+" recorded against "+rec.subjectName+".",true);
          setSubj("");setCharge("");setLocation("");setFine("");setNotes("");setWarrant(false);}
        else notify(res.error,false);
      }}>{saving?"Filing…":"File record"}</Btn>
    </div>

    <h2>Warrants in force</h2>
    {active.length===0?<Empty>No warrants are in force.</Empty>
      :active.map(w=><div key={w.id} className="warrant">
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <b style={{flex:1,minWidth:150}}>{w.subjectName||w.username}</b>
          <span className="hint" style={{margin:0}}>{w.reason}</span>
          <ArmBtn small label="Discharge" confirmLabel="Discharge warrant" onConfirm={async()=>{
            setBusy("Updating");
            const res=await onAction("clearWarrant",{id:w.id});
            setBusy(null);notify(res.ok?"Warrant discharged.":res.error,res.ok);
          }}/>
        </div>
      </div>)}

    <h2>Recent records</h2>
    {recent.length===0?<Empty>Nothing recorded yet.</Empty>
      :<table>
        <thead><tr><th>Type</th><th>Person</th><th>Particulars</th><th>Officer</th><th>Date</th></tr></thead>
        <tbody>{recent.map(r=>{const m=REC_META[r.type]||{l:r.type,tag:"grey"};
          return <tr key={r.id}>
            <td><Tag t={m.tag}>{m.l}</Tag></td>
            <td>{r.subjectName||r.subject}</td>
            <td>{r.charge}{r.location&&<div className="hint" style={{marginBottom:0}}>{r.location}</div>}</td>
            <td>{r.officerName||"—"}</td>
            <td>{fmtDate(r.at)}</td>
          </tr>;})}</tbody>
      </table>}
  </div>;
}

/* ══════════ app ══════════ */
function App(){
  const [user,setUser]=useState(null);
  const [raw,setRaw]=useState({});
  const [loaded,setLoaded]=useState(false);
  const [view,setView]=useState("home");
  const [authOpen,setAuthOpen]=useState(false);
  const [msg,setMsg]=useState(null);
  const [busy,setBusy]=useState(null);

  const notify=useCallback((text,ok)=>{setMsg({text,ok});
    setTimeout(()=>setMsg(m=>m&&m.text===text?null:m),5000);},[]);

  useEffect(()=>{(async()=>{
    const acc=await srestore();
    if(acc)setUser(acc);
    const d=await sgetAll();
    setRaw(d);setLoaded(true);
  })();},[]);

  const accounts=useMemo(()=>{
    const out=[];const seen={};
    Object.values(raw["mi_accounts"]||{}).forEach(a=>{if(a&&a.username&&!seen[lc(a.username)]){seen[lc(a.username)]=1;out.push(a);}});
    return out.sort((a,b)=>String(a.displayName||a.username||"").localeCompare(String(b.displayName||b.username||"")));
  },[raw]);
  const gov=useMemo(()=>raw["wx_gov"]||{},[raw]);
  const home=useMemo(()=>raw["wx_home"]||{},[raw]);
  const ids=useMemo(()=>raw["wx_state_ids"]||{},[raw]);
  const records=useMemo(()=>raw["wx_home_records"]||{},[raw]);
  const warrants=useMemo(()=>raw["wx_warrants"]||{},[raw]);
  const citizens=useMemo(()=>{
    const s=new Set();
    Object.values(raw["wx_state_citizens"]||{}).forEach(c=>{
      if(c&&["citizen","naturalised"].includes(String(c.status||""))) s.add(lc(c.username));
    });
    return s;
  },[raw]);
  // The dossier the Constabulary's terminal reads from: every register on the
  // network that holds something about a person, tagged with its nation so the
  // terminal can tell domestic from foreign.
  const dossier=useMemo(()=>{
    const NATIONS=[
      {k:"wilden",label:"Wilden",cit:"wx_state_citizens",ids:"wx_state_ids",
       pass:"wx_state_passports",visas:"wx_state_visas",recs:"wx_home_records",wars:"wx_warrants"},
      {k:"vindex",label:"Republic of Vindex Nation",cit:"vx_state_citizens",ids:"vx_state_ids",
       pass:"vx_state_passports",visas:"vx_state_visas",recs:"vx_doj_records",wars:"vx_warrants"},
      {k:"lech",label:"Empire of Lech",cit:"mfa_citizens",ids:null,
       pass:"mfa_passports",visas:"mfa_visas",recs:"mi_arrests",wars:null},
    ];
    const out={citizenships:[],ids:[],passports:[],records:[],warrants:[]};
    for(const n of NATIONS){
      const tag=r=>({...r,nation:n.k,nationLabel:n.label});
      Object.values(raw[n.cit]||{}).forEach(c=>{
        if(c&&c.username&&["citizen","naturalised"].includes(String(c.status||""))) out.citizenships.push(tag(c));
      });
      if(n.ids) Object.values(raw[n.ids]||{}).forEach(c=>{if(c&&c.username) out.ids.push(tag(c));});
      const withVisas=Object.values(raw[n.visas]||{}).map(v=>({...v,_nation:n.label}));
      Object.values(raw[n.pass]||{}).forEach(p=>{if(p&&p.username) out.passports.push({...tag(p),_visas:withVisas});});
      if(n.recs) Object.values(raw[n.recs]||{}).forEach(r=>{
        if(!r)return;
        const subj=r.subject||r.username||r.name;
        if(subj) out.records.push(tag({...r,subject:subj}));
      });
      if(n.wars) Object.values(raw[n.wars]||{}).forEach(w=>{if(w&&w.username) out.warrants.push(tag(w));});
    }
    return out;
  },[raw]);

  const onAction=useCallback(async(type,p)=>{
    // The Home Office is written whole: the Constabulary's command, ranks and
    // roster all live in the single wx_home record.
    const putHome=async next=>{const res=await sset("wx_home",next);if(res.ok)setRaw(r=>({...r,wx_home:next}));return res;};
    const cur=home;const agencies={...(cur.agencies||{})};
    const ag={...(agencies[CONSTABULARY.id]||{})};
    if(type==="setHead"){agencies[CONSTABULARY.id]={...ag,head:p.username};return await putHome({...cur,agencies});}
    if(type==="setDeputies"){agencies[CONSTABULARY.id]={...ag,deputies:p.deputies};return await putHome({...cur,agencies});}
    if(type==="setRanks"){agencies[CONSTABULARY.id]={...ag,ranks:p.ranks};return await putHome({...cur,agencies});}
    if(type==="setRoster"){agencies[CONSTABULARY.id]={...ag,roster:p.roster};return await putHome({...cur,agencies});}
    if(type==="issueId"){const next={...ids,[p.username]:p};const res=await sset("wx_state_ids",next);if(res.ok)setRaw(r=>({...r,wx_state_ids:next}));return res;}
    if(type==="revokeId"){const next={...ids};delete next[p.username];const res=await sset("wx_state_ids",next);if(res.ok)setRaw(r=>({...r,wx_state_ids:next}));return res;}
    if(type==="logRecord"){const next={...records,[p.id]:p};const res=await sset("wx_home_records",next);if(res.ok)setRaw(r=>({...r,wx_home_records:next}));return res;}
    if(type==="issueWarrant"){const next={...warrants,[p.id]:p};const res=await sset("wx_warrants",next);if(res.ok)setRaw(r=>({...r,wx_warrants:next}));return res;}
    if(type==="clearWarrant"){const next={...warrants};if(next[p.id])next[p.id]={...next[p.id],status:"cleared",clearedAt:Date.now()};
      const res=await sset("wx_warrants",next);if(res.ok)setRaw(r=>({...r,wx_warrants:next}));return res;}
    return {ok:false,error:"Unknown action."};
  },[home,ids,records,warrants]);

  const admin=homeAdmin(user,gov);
  const enter=canEnter(user,gov,home);
  const office=user?(isHomeSec(user,gov)?"Secretary of State for Home Affairs"
    :isAdminAcct(user)?"Service administrator"
    :isSovereign(user)?"The Sovereign":isPM(user)?"Prime Minister"
    :(titleFor(home,user.username)||"Signed in")):"";

  return <>
    {busy&&<div className="busy">{busy}…</div>}
    {msg&&<div className={"toast"+(msg.ok?"":" bad")}>{msg.text}</div>}
    {authOpen&&<SignIn onClose={()=>setAuthOpen(false)} onAuth={async acc=>{
      setUser(acc);setAuthOpen(false);
      const d=await sgetAll();setRaw(d);
      notify("Signed in as "+(acc.displayName||acc.username)+".",true);
    }}/>}

    <header className="hdr">
      <div className="w">
        <span className="arms"><img src="wildencoa.png" alt=""
          onError={e=>{e.currentTarget.style.display="none";e.currentTarget.nextElementSibling.style.display="inline";}}/>
          <span className="fb" style={{display:"none"}}>◈</span></span>
        <a className="brand" href="wilden.html">Wilden</a>
        <span className="dept">Home Office</span>
        <span className="spacer"/>
        {user?<>
          <span className="who"><b>{user.displayName||user.username}</b>{office}</span>
          <button className="signout" onClick={()=>{forgetSession();setUser(null);setView("home");notify("Signed out.",true);}}>Sign out</button>
        </>:<button className="signin" onClick={()=>setAuthOpen(true)}>Sign in</button>}
      </div>
    </header>

    <main>
      <div className="w">
        {!loaded&&<p className="hint">Loading…</p>}
        {loaded&&<>
          {view==="home"&&<HomeView user={user} gov={gov} home={home} accounts={accounts} citizens={citizens}
            ids={ids} records={records} warrants={warrants} onOpen={setView}/>}
          {view==="secretary"&&(admin
            ?<SecretaryView user={user} gov={gov} home={home} accounts={accounts} citizens={citizens} ids={ids}
              onAction={onAction} notify={notify} setBusy={setBusy} onBack={()=>setView("home")}/>
            :<Notif title="You cannot use this service" kind="warn">
              <p style={{marginBottom:0}}>Only the Secretary of State for Home Affairs may issue identity cards.</p>
              <p style={{marginBottom:0}}><button className="btn small sec" onClick={()=>setView("home")}>Back</button></p>
            </Notif>)}
          {view==="constabulary"&&(enter
            ?<ConstabularyView user={user} gov={gov} home={home} accounts={accounts} citizens={citizens} ids={ids}
              records={records} warrants={warrants} dossier={dossier} onAction={onAction} notify={notify} setBusy={setBusy}
              onBack={()=>setView("home")}/>
            :<Notif title="You cannot use this service" kind="warn">
              <p style={{marginBottom:0}}>The Royal Wilden Constabulary's records are open to its warranted officers
                and to the Home Office.</p>
              <p style={{marginBottom:0}}><button className="btn small sec" onClick={()=>setView("home")}>Back</button></p>
            </Notif>)}
        </>}
      </div>
    </main>

    <footer className="ftr">
      <div className="w">
        <div className="lic">Published by the Home Office of Wilden. Part of{" "}
          <a href="wilden.html">Wilden government services</a>.</div>
      </div>
    </footer>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
