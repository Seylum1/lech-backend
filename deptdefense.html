@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:.6;}50%{opacity:1;}}

.mono{font-family:'Share Tech Mono',monospace;}

</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo}=React;

/* ═══════════════════════════════════════════════════════════════════════════
   REPUBLIC OF VINDEX NATION — DEPARTMENT OF DEFENSE
   The Republic's armed forces, modelled on the Empire's War Office but under a
   republic's chain of command: the President is Commander-in-Chief, the
   Secretary of Defense runs the Department, and the Joint Chiefs command the
   services. Shares the backend under vx_dod* keys and the shared account.

   Command authority is read, never re-entered: the President, the Vice
   President and the Secretary of Defense are recognised from their appointments
   on vindex.html (vxRole, and the Cabinet post in vx_gov). Every other
   appointment — the Deputy Secretary, the Chairman, the service chiefs, and the
   whole roster — is made here, inside the Department.
   ═══════════════════════════════════════════════════════════════════════════ */
const V={
  bg:"#0b1930",bg2:"#102344",panel:"#13294e",panel2:"#1a3560",line:"#24406e",lineL:"#3a5a94",
  text:"#e8ebf2",textD:"#93a4c3",textDD:"#4d648f",
  gold:"#c9a05a",goldL:"#e2c078",navy:"#0e1f42",
  red:"#c03038",redD:"#7a1c22",redL:"#e08080",green:"#2e8b3d",greenL:"#63c74d",
};

function uid(){return Date.now()+"_"+Math.random().toString(36).slice(2,8);}
const lc=s=>String(s||"").toLowerCase();
function fmtDate(d){if(d===undefined||d===null||d==="")return "—";const s=(typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d))?d+"T12:00:00":d;const t=typeof s==="number"?s:new Date(s).getTime();if(isNaN(t))return ""+d;return new Date(t).toLocaleDateString("en-US",{month:"short",day:"2-digit",year:"numeric"});}
function mcFace(n){return "https://mc-heads.net/avatar/"+encodeURIComponent(n||"")+"/128";}

/* ── backend (shared session) ────────────────────────────────────────────── */
const API="https://lech-backend.onrender.com";
let AUTH_TOKEN=null;
const SESSION_KEY="lech_session",SESSION_ACC_KEY="lech_session_acc";
function saveSession(t,acc){try{if(t)localStorage.setItem(SESSION_KEY,t);if(acc)localStorage.setItem(SESSION_ACC_KEY,JSON.stringify(acc));}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_ACC_KEY);}catch(e){}AUTH_TOKEN=null;}
function forgetSession(){const t=AUTH_TOKEN;clearSession();try{if(t)fetch(API+"/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t})});}catch(e){}}
async function srestore(){let t=null;try{t=localStorage.getItem(SESSION_KEY);}catch(e){}if(!t)return null;AUTH_TOKEN=t;try{const r=await fetch(API+"/api/me?token="+encodeURIComponent(t));const d=await r.json();if(d&&d.ok&&d.account){saveSession(t,d.account);return d.account;}clearSession();return null;}catch(e){return null;}}
async function sgetAll(){try{const r=await fetch(API+"/api/data"+(AUTH_TOKEN?"?token="+encodeURIComponent(AUTH_TOKEN):""));const d=await r.json();return (d&&d.ok)?(d.data||{}):{};}catch{return{};}}
async function sset(k,v){try{const r=await fetch(API+"/api/set",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:AUTH_TOKEN,key:k,value:v})});const d=await r.json();return (d&&d.ok)?{ok:true}:{ok:false,error:(d&&d.error)||"Refused."};}catch{return {ok:false,error:"Connection error."};}}
async function slogin(username,password){try{const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:String(username||"").trim(),password})});const d=await r.json();if(d&&d.ok){AUTH_TOKEN=d.token;saveSession(d.token,d.account);return {ok:true,account:d.account};}return {ok:false,error:(d&&d.error)||"ACCESS DENIED"};}catch(e){return {ok:false,error:"Connection error"};}}

/* ── the services ─────────────────────────────────────────────────────────── */
const BRANCHES=[
  {v:"VA", l:"Vindex Army", short:"Army", color:"#6a8a4a", seal:"vnarmy.png"},
  {v:"VN", l:"Vindex Navy", short:"Navy", color:"#4a6a9a", seal:"vnnavy.png"},
];
// A formation may answer to neither service alone. "Joint" exists in the order of
// battle only — nobody serves in it, so it is not a branch anyone can enlist into.
const ORBAT_BRANCHES=[...BRANCHES,{v:"JOINT",l:"Joint",short:"Joint",color:"#9a7ab0",seal:null}];
const branchOf=v=>ORBAT_BRANCHES.find(b=>b.v===v)||BRANCHES[0];

const ARMY_RANKS=[
  {grade:"E-1",title:"Private",abbr:"PVT",group:"Enlisted"},
  {grade:"E-2",title:"Private First Class",abbr:"PFC",group:"Enlisted"},
  {grade:"E-4",title:"Specialist",abbr:"SPC",group:"Enlisted"},
  {grade:"E-5",title:"Sergeant",abbr:"SGT",group:"NCO"},
  {grade:"E-6",title:"Staff Sergeant",abbr:"SSG",group:"NCO"},
  {grade:"E-7",title:"Sergeant First Class",abbr:"SFC",group:"NCO"},
  {grade:"E-8",title:"Master Sergeant",abbr:"MSG",group:"Senior NCO"},
  {grade:"E-9",title:"Sergeant Major",abbr:"SGM",group:"Senior NCO"},
  {grade:"O-1",title:"Second Lieutenant",abbr:"2LT",group:"Officer"},
  {grade:"O-2",title:"First Lieutenant",abbr:"1LT",group:"Officer"},
  {grade:"O-3",title:"Captain",abbr:"CPT",group:"Officer"},
  {grade:"O-4",title:"Major",abbr:"MAJ",group:"Field Officer"},
  {grade:"O-5",title:"Lieutenant Colonel",abbr:"LTC",group:"Field Officer"},
  {grade:"O-6",title:"Colonel",abbr:"COL",group:"Field Officer"},
  {grade:"O-7",title:"Brigadier General",abbr:"BG",group:"General Officer"},
  {grade:"O-8",title:"Major General",abbr:"MG",group:"General Officer"},
  {grade:"O-9",title:"Lieutenant General",abbr:"LTG",group:"General Officer"},
  {grade:"O-10",title:"General",abbr:"GEN",group:"General Officer"},
];
const NAVY_RANKS=[
  {grade:"E-1",title:"Seaman Recruit",abbr:"SR",group:"Enlisted"},
  {grade:"E-2",title:"Seaman Apprentice",abbr:"SA",group:"Enlisted"},
  {grade:"E-4",title:"Petty Officer Third Class",abbr:"PO3",group:"Enlisted"},
  {grade:"E-5",title:"Petty Officer Second Class",abbr:"PO2",group:"NCO"},
  {grade:"E-6",title:"Petty Officer First Class",abbr:"PO1",group:"NCO"},
  {grade:"E-7",title:"Chief Petty Officer",abbr:"CPO",group:"NCO"},
  {grade:"E-8",title:"Senior Chief Petty Officer",abbr:"SCPO",group:"Senior NCO"},
  {grade:"E-9",title:"Master Chief Petty Officer",abbr:"MCPO",group:"Senior NCO"},
  {grade:"O-1",title:"Ensign",abbr:"ENS",group:"Officer"},
  {grade:"O-2",title:"Lieutenant Junior Grade",abbr:"LTJG",group:"Officer"},
  {grade:"O-3",title:"Lieutenant",abbr:"LT",group:"Officer"},
  {grade:"O-4",title:"Lieutenant Commander",abbr:"LCDR",group:"Field Officer"},
  {grade:"O-5",title:"Commander",abbr:"CDR",group:"Field Officer"},
  {grade:"O-6",title:"Captain",abbr:"CAPT",group:"Field Officer"},
  {grade:"O-7",title:"Rear Admiral (Lower Half)",abbr:"RDML",group:"Flag Officer"},
  {grade:"O-8",title:"Rear Admiral",abbr:"RADM",group:"Flag Officer"},
  {grade:"O-9",title:"Vice Admiral",abbr:"VADM",group:"Flag Officer"},
  {grade:"O-10",title:"Admiral",abbr:"ADM",group:"Flag Officer"},
];
const BRANCH_RANKS={VA:ARMY_RANKS,VN:NAVY_RANKS};
const ranksFor=b=>BRANCH_RANKS[b]||ARMY_RANKS;
const getRank=(b,g)=>ranksFor(b).find(r=>r.grade===g)||null;
const rankOrder=g=>{const [k,n]=String(g||"E-1").split("-");return (k==="O"?100:0)+(parseInt(n,10)||0);};

/* ── readiness ────────────────────────────────────────────────────────────── */
const DEFCON=[
  {v:5,l:"DEFCON 5",d:"Normal peacetime readiness.",color:"#4a8a5a"},
  {v:4,l:"DEFCON 4",d:"Heightened intelligence watch and strengthened security.",color:"#7a9a4a"},
  {v:3,l:"DEFCON 3",d:"Forces on standby, above normal readiness.",color:"#c9a05a"},
  {v:2,l:"DEFCON 2",d:"Armed forces ready to deploy and engage in under six hours.",color:"#d4703a"},
  {v:1,l:"DEFCON 1",d:"Maximum readiness. Hostilities imminent or under way.",color:"#c03038"},
];
const defconOf=v=>DEFCON.find(d=>d.v===Number(v))||DEFCON[0];

/* ── appointments made inside the Department ──────────────────────────────── */
// `source` decides who the appointment dropdown may draw from:
//   "civilian" — any citizen of the Republic (a civilian post)
//   "serving"  — any serving member, of either service
//   "branch"   — only those serving in this post's own service
const DOD_PRINCIPALS=[
  {v:"deputy_secretary", l:"Deputy Secretary of Defense",abbr:"DEPSECDEF",
   note:"Second to the Secretary; acts in their absence. A civilian post.",command:true,source:"civilian"},
  {v:"chairman_jcs",     l:"Chairman of the Joint Chiefs of Staff",abbr:"CJCS",
   note:"Principal military adviser to the President and the Secretary. Drawn from either service.",command:true,source:"serving"},
  {v:"chief_army",       l:"Chief of Staff of the Army",abbr:"CSA",
   note:"Commands the Vindex Army.",command:true,branch:"VA",source:"branch"},
  {v:"vice_chief_army",  l:"Vice Chief of Staff of the Army",abbr:"VCSA",
   note:"Second in the Army's chain of command.",command:true,branch:"VA",source:"branch"},
  {v:"chief_navy",       l:"Chief of Naval Operations",abbr:"CNO",
   note:"Commands the Vindex Navy.",command:true,branch:"VN",source:"branch"},
  {v:"vice_chief_navy",  l:"Vice Chief of Naval Operations",abbr:"VCNO",
   note:"Second in the Navy's chain of command.",command:true,branch:"VN",source:"branch"},
];

const ASSET_CATEGORIES=[
  {v:"vessel",  l:"Vessels",        one:"Vessel",        icon:"⚓"},
  {v:"aircraft",l:"Aircraft",       one:"Aircraft",      icon:"✈"},
  {v:"vehicle", l:"Ground Vehicles",one:"Ground Vehicle",icon:"🛞"},
  {v:"install", l:"Installations",  one:"Installation",  icon:"🏛"},
];
const ASSET_STATUS=[
  {v:"active",  l:"In service",   color:V.greenL},
  {v:"reserve", l:"In reserve",   color:V.textD},
  {v:"repair",  l:"Under repair", color:V.gold},
  {v:"lost",    l:"Lost",         color:V.red},
];
const OP_STATUS=[
  {v:"planning", l:"Planning",  color:V.textD},
  {v:"active",   l:"Active",    color:V.greenL},
  {v:"complete", l:"Concluded", color:"#6fa8ff"},
  {v:"aborted",  l:"Aborted",   color:V.red},
];

/* ══════════ UI atoms ══════════ */
function Btn({children,onClick,variant="primary",disabled,small,style:ex={}}){
  const S={
    primary:{background:`linear-gradient(180deg,${V.panel2},${V.navy})`,borderColor:V.lineL,color:V.text},
    gold:{background:`linear-gradient(180deg,${V.gold},#a8823f)`,borderColor:V.goldL,color:"#1a1200"},
    ghost:{background:"transparent",borderColor:V.line,color:V.textD},
    danger:{background:"transparent",borderColor:V.redD,color:V.redL},
    armed:{background:V.red,borderColor:V.red,color:"#fff"},
  }[variant]||{};
  return <button onClick={onClick} disabled={disabled} style={{padding:small?"5px 12px":"9px 18px",
    fontSize:small?12.5:14,fontFamily:"'Crimson Text',serif",borderRadius:3,borderWidth:1,borderStyle:"solid",
    cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.45:1,whiteSpace:"nowrap",...S,...ex}}>{children}</button>;
}
function ArmBtn({label,confirmLabel,onConfirm,small}){
  const [a,setA]=useState(false);
  useEffect(()=>{if(!a)return;const t=setTimeout(()=>setA(false),4000);return()=>clearTimeout(t);},[a]);
  return a?<Btn variant="armed" small={small} onClick={()=>{setA(false);onConfirm();}}>{confirmLabel||"Confirm?"}</Btn>
    :<Btn variant="danger" small={small} onClick={()=>setA(true)}>{label}</Btn>;
}
function Inp({value,onChange,placeholder,type="text",style:ex={}}){
  return <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
    style={{width:"100%",background:V.bg2,border:`1px solid ${V.line}`,borderRadius:3,padding:"8px 12px",color:V.text,fontSize:14,outline:"none",...ex}}
    onFocus={e=>e.target.style.borderColor=V.gold} onBlur={e=>e.target.style.borderColor=V.line}/>;
}
function TA({value,onChange,placeholder,rows=4}){
  return <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows}
    style={{width:"100%",background:V.bg2,border:`1px solid ${V.line}`,borderRadius:3,padding:"8px 12px",color:V.text,fontSize:14,outline:"none",resize:"vertical",lineHeight:1.7}}
    onFocus={e=>e.target.style.borderColor=V.gold} onBlur={e=>e.target.style.borderColor=V.line}/>;
}
function Sel({value,onChange,options,style:ex={}}){
  return <select value={value} onChange={e=>onChange(e.target.value)}
    style={{width:"100%",background:V.bg2,border:`1px solid ${V.line}`,borderRadius:3,padding:"8px 12px",color:V.text,fontSize:14,outline:"none",fontFamily:"'Crimson Text',serif",...ex}}>
    {options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
  </select>;
}
function FL({children}){return <div className="mono" style={{fontSize:9,color:V.textD,letterSpacing:"0.18em",marginBottom:4,textTransform:"uppercase"}}>{children}</div>;}
function STitle({children,color}){return <div style={{display:"flex",alignItems:"center",gap:12,margin:"1.7rem 0 1rem"}}>
  <span className="pf" style={{fontWeight:700,fontSize:13,letterSpacing:"0.26em",textTransform:"uppercase",color:color||V.gold}}>{children}</span>
  <span style={{flex:1,height:1,background:`linear-gradient(90deg,${V.line},transparent)`}}/></div>;}
function Empty({children}){return <div style={{fontSize:14,color:V.textDD,fontStyle:"italic",padding:"1.2rem 0"}}>{children}</div>;}
function Tag({children,color}){return <span className="mono" style={{fontSize:8.5,letterSpacing:"0.14em",color:color||V.textDD,
  border:`1px solid ${(color||V.textDD)}55`,background:(color||V.textDD)+"14",borderRadius:2,padding:"2px 7px",whiteSpace:"nowrap"}}>{children}</span>;}
function Toast({msg,color}){if(!msg)return null;return <div style={{position:"fixed",bottom:22,left:"50%",transform:"translateX(-50%)",
  zIndex:99998,background:V.panel,border:`1px solid ${color||V.gold}`,borderRadius:3,padding:"11px 22px",color:color||V.gold,fontSize:14,boxShadow:"0 8px 26px rgba(0,0,0,.55)"}}>{msg}</div>;}
function Overlay({label}){if(!label)return null;return <div style={{position:"fixed",inset:0,zIndex:99999,background:"rgba(6,12,26,.96)",display:"flex",alignItems:"center",justifyContent:"center"}}>
  <div style={{textAlign:"center"}}><div className="mono" style={{color:V.gold,fontSize:10,letterSpacing:"0.35em",marginBottom:8,animation:"pulse 1s infinite"}}>PROCESSING</div>
  <div className="pf" style={{fontSize:17,color:V.text}}>{label}</div></div></div>;}
function Face({account,name,size=34}){
  const n=(account&&(account.mcName||account.username))||name||"";
  const [ok,setOk]=useState(true);
  if(!n||!ok)return <div style={{width:size,height:size,borderRadius:3,background:V.panel2,border:`1px solid ${V.line}`,flexShrink:0}}/>;
  return <img src={mcFace(n)} alt="" draggable={false} onError={()=>setOk(false)}
    style={{width:size,height:size,borderRadius:3,imageRendering:"pixelated",border:`1px solid ${V.line}`,flexShrink:0}}/>;
}
// Departmental and service seals. Each falls back to a star if its artwork is
// not yet beside the page.
function Seal({file="defense.png",size=64,color,style:ex={}}){
  const [ok,setOk]=useState(true);
  if(!ok||!file)return <div style={{width:size,height:size,borderRadius:"50%",border:`2px solid ${(color||V.gold)}55`,
    display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,background:V.navy,...ex}}>
    <span className="pf" style={{fontWeight:900,fontSize:size*0.4,color:color||V.gold}}>★</span></div>;
  return <img src={file} alt="" draggable={false} onError={()=>setOk(false)}
    style={{width:size,height:size,objectFit:"contain",flexShrink:0,...ex}}/>;
}
function RankBadge({branch,grade}){
  const r=getRank(branch,grade);if(!r)return null;
  const b=branchOf(branch);
  return <span className="mono" style={{fontSize:9,letterSpacing:"0.1em",color:b.color,
    border:`1px solid ${b.color}66`,background:b.color+"18",borderRadius:2,padding:"2px 7px",whiteSpace:"nowrap"}}>{r.abbr}</span>;
}

/* ══════════ standing ══════════ */
const isEmperor=u=>!!u&&u.role==="emperor";
const vxRole=u=>String((u&&u.vxRole)||"");
const isPresident=u=>vxRole(u)==="president";
const isVP=u=>vxRole(u)==="vice_president";
// The Secretary of Defense is not re-appointed here — they are whoever the
// President seated in that Cabinet post on vindex.html.
function secDefName(gov){
  const cab=(gov&&gov.cabinet)||{};
  const k=Object.keys(cab).find(u=>String(cab[u]||"").trim().toLowerCase()==="secretary of defense");
  return k?lc(k):"";
}
const isSecDef=(u,gov)=>!!u&&!!secDefName(gov)&&lc(u.username)===secDefName(gov);
// The civilian direction of the Department: the Commander-in-Chief, the Vice
// President, and the Secretary. These need no appointment inside the Department.
const isDodPrincipalCivilian=(u,gov)=>isEmperor(u)||isPresident(u)||isVP(u)||isSecDef(u,gov);
function principalPostOf(u,dod){
  if(!u)return null;
  const p=(dod&&dod.principals)||{};
  return Object.keys(p).find(post=>lc(p[post])===lc(u.username))||null;
}
// Command authority: the civilian principals, plus anyone holding a principal
// appointment made inside the Department.
function canCommand(u,gov,dod){
  if(isDodPrincipalCivilian(u,gov))return true;
  const post=principalPostOf(u,dod);
  return !!post&&!!DOD_PRINCIPALS.find(p=>p.v===post&&p.command);
}
// Only the civilian principals may make the Department's own appointments.
const canAppoint=(u,gov)=>isDodPrincipalCivilian(u,gov);
function servingRecord(u,personnel){
  if(!u)return null;
  return Object.values(personnel||{}).find(p=>p&&lc(p.username)===lc(u.username)&&String(p.status||"active")==="active")||null;
}
// Who may see the Department at all: its civilian direction, its principals, and
// anyone on the active roster.
function hasAccess(u,gov,dod,personnel){
  return canCommand(u,gov,dod)||!!principalPostOf(u,dod)||!!servingRecord(u,personnel);
}
function titleFor(u,gov,dod,personnel){
  if(isEmperor(u))return "System Administrator";
  if(isPresident(u))return "Commander-in-Chief";
  if(isVP(u))return "Vice President";
  if(isSecDef(u,gov))return "Secretary of Defense";
  const post=principalPostOf(u,dod);
  if(post){const p=DOD_PRINCIPALS.find(x=>x.v===post);if(p)return p.l;}
  const rec=servingRecord(u,personnel);
  if(rec){const r=getRank(rec.branch,rec.grade);return (r?r.title:"Service member")+", "+branchOf(rec.branch).l;}
  return "No standing";
}

/* ══════════ sign-in ══════════ */
function AuthModal({onClose,onAuth}){
  const [u,setU]=useState("");const [p,setP]=useState("");const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const go=async()=>{
    if(busy)return;
    if(!u.trim()||!p){setErr("Enter your credentials.");return;}
    setBusy(true);setErr("");
    const res=await slogin(u,p);
    if(!res.ok){setErr(res.error==="ACCESS DENIED"?"Credentials rejected.":res.error);setBusy(false);return;}
    onAuth(res.account);
  };
  return <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
    style={{position:"fixed",inset:0,zIndex:9000,background:"rgba(5,10,22,.92)",display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
    <div style={{background:V.bg2,border:`1px solid ${V.line}`,borderRadius:5,padding:"1.6rem",width:"100%",maxWidth:360}}>
      <div className="mono" style={{fontSize:9,letterSpacing:"0.3em",color:V.gold,textAlign:"center",marginBottom:14}}>DEPARTMENT OF DEFENSE — SIGN IN</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div><FL>Username</FL><Inp value={u} onChange={setU} placeholder="Username"/></div>
        <div><FL>Password</FL><Inp value={p} onChange={setP} type="password" placeholder="Password"/></div>
        {err&&<div style={{fontSize:13,color:V.redL,textAlign:"center"}}>{err}</div>}
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <Btn small variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn small variant="gold" disabled={busy} onClick={go}>{busy?"Signing in…":"Sign In"}</Btn>
        </div>
        <div style={{fontSize:11.5,color:V.textDD,fontStyle:"italic",textAlign:"center",lineHeight:1.6}}>
          One account for the whole network — register on the <a href="index.html" style={{color:V.goldL}}>Vintranet</a>.
        </div>
      </div>
    </div>
  </div>;
}

/* ══════════ home ══════════ */
function CommandCard({title,name,account,note,color,size=44}){
  return <div style={{background:V.panel,border:`1px solid ${V.line}`,borderTop:`3px solid ${color||V.gold}`,
    borderRadius:"0 0 4px 4px",padding:"0.9rem 1rem",display:"flex",gap:11,alignItems:"center"}}>
    {name?<Face account={account} name={name} size={size}/>

/* ══════════ personnel ══════════ */
function PersonnelTab({user,gov,dod,personnel,commands,accounts,citizens,canManage,onAction,notify,setProcessing}){

    .filter(p=>p&&(showDischarged||String(p.status||"active")==="active"))
    .filter(p=>!branch||p.branch===branch)
    .filter(p=>{const s=lc(q);return !s||lc(p.name).includes(s)||lc(p.username).includes(s)||lc(cmdName(p.command)).includes(s);})
    .sort((a,b)=>rankOrder(b.grade)-rankOrder(a.grade)||String(a.name||"").localeCompare(String(b.name||"")));

      <div style={{flex:1,minWidth:150}}><Sel value={branch} onChange={setBranch}
        options={[{v:"",l:"All services"},...BRANCHES.map(b=>({v:b.v,l:b.l}))]}/></div>
      <Btn small variant="ghost" onClick={()=>setShowDischarged(s=>!s)}>{showDischarged?"Hide discharged":"Show discharged"}</Btn>
      {canManage&&<Btn small variant="gold" onClick={()=>{setAdding(true);setEditId(null);}}>+ Enlist</Btn>}
    </div>

    {adding&&<PersonnelForm accounts={accounts} citizens={citizens} personnel={personnel} commands={commands}
      onClose={()=>setAdding(false)} onAction={onAction} notify={notify} setProcessing={setProcessing}/>}

          ["Command",cmd?cmd.name:"—"],["Enlisted",person.enlisted?fmtDate(person.enlisted):"—"]].map(([k,v])=>(

        setProcessing("Reinstating…");

function PersonnelEdit({person,commands,onAction,notify,setProcessing}){
  const [grade,setGrade]=useState(person.grade||"E-1");
  const [command,setCommand]=useState(person.command||"");
  const [saving,setSaving]=useState(false);
  // A member is posted to a formation in the order of battle — their own
  // service's, or a joint one. There are no free-text units.
  const cmdOpts=[{v:"",l:"— Unassigned —"},...Object.values(commands||{})
    .filter(c=>c.branch===person.branch||c.branch==="JOINT").map(c=>({v:c.id,l:c.name}))];
  const cmdName=id=>{const c=(commands||{})[id];return c?c.name:"";};
  return <div style={{borderTop:`1px solid ${V.line}`,paddingTop:12}}>
    <FL>Amend the record</FL>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
      <div style={{flex:1,minWidth:170}}><FL>Rank</FL>
        <Sel value={grade} onChange={setGrade} options={ranksFor(person.branch).map(r=>({v:r.grade,l:r.grade+" — "+r.title}))}/></div>
      <div style={{flex:1,minWidth:180}}><FL>Command</FL><Sel value={command} onChange={setCommand} options={cmdOpts}/></div>
      <Btn small variant="gold" disabled={saving} onClick={async()=>{
        setSaving(true);setProcessing("Amending…");
        const hist=[...(person.history||[])];
        if(grade!==person.grade){
          const from=getRank(person.branch,person.grade),to=getRank(person.branch,grade);
          const up=rankOrder(grade)>rankOrder(person.grade);
          hist.push({at:Date.now(),entry:(up?"Promoted":"Reduced")+" to "+(to?to.title:grade)+(from?" from "+from.title:"")});
        }
        if(command!==(person.command||"")) hist.push({at:Date.now(),
          entry:command?("Posted to "+cmdName(command)):"Removed from command"});
        const res=await onAction("updatePerson",{...person,grade,command,history:hist});
        setProcessing(null);setSaving(false);
        notify(res.ok?"Record amended.":res.error,res.ok?V.greenL:V.redL);
      }}>{saving?"Saving…":"Save"}</Btn>
      <DischargeBtn person={person} onAction={onAction} notify={notify} setProcessing={setProcessing}/>
    </div>
  </div>;
}
function DischargeBtn({person,onAction,notify,setProcessing}){

}
function PersonnelForm({accounts,citizens,personnel,commands,onClose,onAction,notify,setProcessing}){

/* ══════════ commands (order of battle) ══════════ */
function CommandsTab({commands,personnel,canManage,onAction,notify,setProcessing}){
  const [adding,setAdding]=useState(false);
  const all=Object.values(commands||{});
  const roots=all.filter(c=>!c.parent||!commands[c.parent]);
  const childrenOf=id=>all.filter(c=>c.parent===id);
  const strength=id=>Object.values(personnel||{}).filter(p=>p&&p.command===id&&String(p.status||"active")==="active").length;
  const Node=({cmd,depth})=>{
    const b=branchOf(cmd.branch);const kids=childrenOf(cmd.id);
    return <div style={{marginLeft:depth?18:0,borderLeft:depth?`1px solid ${V.line}`:"none",paddingLeft:depth?12:0}}>
      <div style={{background:V.panel,border:`1px solid ${V.line}`,borderLeft:`3px solid ${b.color}`,
        borderRadius:"0 4px 4px 0",padding:"0.7rem 1rem",marginBottom:6,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:160}}>
          <div className="pf" style={{fontWeight:700,fontSize:15,color:V.text}}>{cmd.name}</div>
          <div className="mono" style={{fontSize:9,color:V.textDD,marginTop:2}}>
            {b.short.toUpperCase()}{cmd.type?" · "+String(cmd.type).toUpperCase():""} · {strength(cmd.id)} SERVING
          </div>
        </div>
        {cmd.note&&<span style={{fontSize:12,color:V.textDD,fontStyle:"italic",flex:1,minWidth:140}}>{cmd.note}</span>}
        {canManage&&<ArmBtn small label="Disband" confirmLabel="Disband this command?" onConfirm={async()=>{
          setProcessing("Disbanding…");
          const res=await onAction("deleteCommand",{id:cmd.id});
          setProcessing(null);notify(res.ok?"Command disbanded.":res.error,res.ok?V.textD:V.redL);
        }}/>}
      </div>
      {kids.map(k=><Node key={k.id} cmd={k} depth={depth+1}/>)}
    </div>;
  };
  return <div className="fadeIn">
    <STitle>Order of Battle</STitle>
    <div style={{fontSize:13.5,color:V.textD,fontStyle:"italic",lineHeight:1.7,marginBottom:12}}>
      Every formation of the armed forces, and the chain each answers to.

    {canManage&&<div style={{marginBottom:12}}>
      {adding?<CommandForm commands={commands} onClose={()=>setAdding(false)} onAction={onAction} notify={notify} setProcessing={setProcessing}/>
        :<Btn small variant="gold" onClick={()=>setAdding(true)}>+ Raise a command</Btn>}
    </div>}
    {all.length===0?<Empty>No commands have been raised.</Empty>:roots.map(c=><Node key={c.id} cmd={c} depth={0}/>)}
  </div>;
}

function PrincipalRow({post,dod,accounts,citizens,personnel,onAction,notify,setProcessing}){
  const cur=((dod.principals||{})[post.v])||"";
  const [u,setU]=useState(cur);const [saving,setSaving]=useState(false);
  useEffect(()=>{setU(cur);},[cur]);
  // Each post draws from its own pool: a civilian post from the citizenry, a
  // service post from that service's own people, the Chairman from either.
  const serving=Object.values(personnel||{}).filter(p=>p&&String(p.status||"active")==="active");
  const nameFor=un=>{const a=accounts[lc(un)];return a?((a.displayName?a.displayName+" ":"")+"@"+a.username):("@"+un);};
  let pool=[],emptyNote="";
  if(post.source==="civilian"){
    pool=Object.values(accounts||{}).filter(a=>citizens.has(lc(a.username)))
      .sort((a,b)=>String(a.displayName||a.username||"").localeCompare(String(b.displayName||b.username||"")))
      .map(a=>({v:a.username,l:(a.displayName?a.displayName+" ":"")+"@"+a.username}));
    emptyNote="No citizens on the register.";
  } else {
    const from=post.source==="branch"?serving.filter(p=>p.branch===post.branch):serving;
    pool=from.sort((a,b)=>rankOrder(b.grade)-rankOrder(a.grade))
      .map(p=>{const r=getRank(p.branch,p.grade);
        return {v:p.username,l:(r?r.abbr+" ":"")+(p.name||p.username)+" — "+branchOf(p.branch).short};});
    emptyNote=post.source==="branch"
      ?("No one is serving in the "+branchOf(post.branch).l+" yet.")
      :"No one is serving yet.";
  }
  // A holder appointed before the pool narrowed stays selectable, so they can be
  // seen and replaced rather than silently vanishing from the list.
  if(cur&&!pool.some(o=>lc(o.v)===lc(cur))) pool=[{v:cur,l:nameFor(cur)+" (current)"},...pool];
  const opts=[{v:"",l:pool.length?"— Vacant —":"— "+emptyNote+" —"},...pool];
  const b=post.branch?branchOf(post.branch):null;
  return <div style={{background:V.panel,border:`1px solid ${V.line}`,borderLeft:`3px solid ${b?b.color:V.gold}`,
    borderRadius:"0 3px 3px 0",padding:"0.8rem 1rem",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
    <div style={{flex:1,minWidth:180}}>
      <div style={{display:"flex",gap:8,alignItems:"baseline",flexWrap:"wrap"}}>
        <span className="pf" style={{fontWeight:700,fontSize:14.5,color:V.text}}>{post.l}</span>
        {post.abbr&&<Tag color={b?b.color:V.gold}>{post.abbr}</Tag>}
      </div>
      <div style={{fontSize:12,color:V.textDD,fontStyle:"italic",marginTop:2,lineHeight:1.5}}>{post.note}</div>
    </div>
    <div style={{flex:1,minWidth:200}}><Sel value={u} onChange={setU} options={opts}/></div>
    <Btn small variant="gold" disabled={saving||lc(u)===lc(cur)} onClick={async()=>{
      setSaving(true);setProcessing("Appointing…");
      const res=await onAction("setPrincipal",{post:post.v,username:lc(u)});
      setProcessing(null);setSaving(false);
      notify(res.ok?(u?"Appointment made.":"Post vacated."):res.error,res.ok?V.greenL:V.redL);
    }}>{saving?"Saving…":"Appoint"}</Btn>
  </div>;
}

/* ══════════ app ══════════ */
function App(){
  const [user,setUser]=useState(null);
  const [raw,setRaw]=useState({});
  const [loaded,setLoaded]=useState(false);
  const [restoring,setRestoring]=useState(true);
  const [tab,setTab]=useState("home");
  const [authOpen,setAuthOpen]=useState(false);
  const [toast,setToast]=useState({msg:"",color:V.gold});
  const [processing,setProcessing]=useState(null);

  const notify=useCallback((msg,color=V.gold)=>{setToast({msg,color});
    setTimeout(()=>setToast(t=>t.msg===msg?{msg:"",color}:t),4000);},[]);

  useEffect(()=>{(async()=>{
    const acc=await srestore();
    if(acc)setUser(acc);
    const d=await sgetAll();
    setRaw(d);setLoaded(true);setRestoring(false);
  })();},[]);

  const accounts=useMemo(()=>{
    const out={};
    Object.values(raw["mi_accounts"]||{}).forEach(a=>{if(a&&a.username)out[lc(a.username)]=a;});
    return out;
  },[raw]);
  const gov=useMemo(()=>raw["vx_gov"]||{},[raw]);
  // Only a citizen of the Republic may serve it. The roll comes from the
  // Department of State's register, exactly as the government portal reads it.
  const citizens=useMemo(()=>{
    const s=new Set();
    Object.values(raw["vx_state_citizens"]||{}).forEach(c=>{
      if(c&&["citizen","naturalised"].includes(String(c.status||""))) s.add(lc(c.username));
    });
    return s;
  },[raw]);
  const dod=useMemo(()=>raw["vx_dod"]||{},[raw]);
  const personnel=useMemo(()=>raw["vx_dod_personnel"]||{},[raw]);
  const commands=useMemo(()=>raw["vx_dod_commands"]||{},[raw]);
  const assets=useMemo(()=>raw["vx_dod_assets"]||{},[raw]);
  const operations=useMemo(()=>raw["vx_dod_operations"]||{},[raw]);

  const access=hasAccess(user,gov,dod,personnel);
  const canManage=canCommand(user,gov,dod);
  const canAppointHere=canAppoint(user,gov);
  const myTitle=user?titleFor(user,gov,dod,personnel):"";

  const onAction=useCallback(async(type,p)=>{
    const putMap=async(key,next)=>{
      const res=await sset(key,next);
      if(res.ok)setRaw(r=>({...r,[key]:next}));
      return res;
    };
    const putDod=async(next)=>{
      const res=await sset("vx_dod",next);
      if(res.ok)setRaw(r=>({...r,vx_dod:next}));
      return res;
    };
    if(type==="createPerson"||type==="updatePerson"){
      const rec=type==="createPerson"?p:p;
      return await putMap("vx_dod_personnel",{...personnel,[rec.id]:rec});
    }
    if(type==="createCommand") return await putMap("vx_dod_commands",{...commands,[p.id]:p});
    if(type==="deleteCommand"){
      const next={...commands};delete next[p.id];
      // Anything reporting to it is detached rather than silently orphaned.
      Object.keys(next).forEach(k=>{if(next[k].parent===p.id)next[k]={...next[k],parent:""};});
      return await putMap("vx_dod_commands",next);
    }
    if(type==="createAsset"||type==="updateAsset") return await putMap("vx_dod_assets",{...assets,[p.id]:p});
    if(type==="deleteAsset"){const next={...assets};delete next[p.id];return await putMap("vx_dod_assets",next);}
    if(type==="createOperation"||type==="updateOperation") return await putMap("vx_dod_operations",{...operations,[p.id]:p});
    if(type==="deleteOperation"){const next={...operations};delete next[p.id];return await putMap("vx_dod_operations",next);}
    if(type==="setDefcon") return await putDod({...dod,defcon:p.defcon,defconSetBy:p.byName,defconAt:Date.now()});
    if(type==="setAnnouncement") return await putDod({...dod,announcement:p.text?{text:p.text,at:Date.now(),by:p.by,byName:p.byName}:null});
    if(type==="setPrincipal"){
      const next={...(dod.principals||{})};
      if(p.username)next[p.post]=p.username;else delete next[p.post];
      return await putDod({...dod,principals:next});
    }
    return {ok:false,error:"Unknown action."};
  },[dod,personnel,commands,assets,operations]);

  const TABS=[
    {v:"home",l:"The Department"},
    ...(access?[{v:"personnel",l:"Personnel"},{v:"commands",l:"Order of Battle"},
      {v:"assets",l:"Assets"},{v:"operations",l:"Operations"}]:[]),
    ...(canAppointHere||canManage?[{v:"secretary",l:"Secretary's Office"}]:[]),
  ];
  useEffect(()=>{if(!TABS.find(t=>t.v===tab))setTab("home");},[access,canManage,canAppointHere]);

  return <div style={{minHeight:"100vh",background:`radial-gradient(ellipse 80% 45% at 50% -5%, #1c3a6e55, transparent 60%), ${V.bg}`}}>
    <Toast msg={toast.msg} color={toast.color}/>
    <Overlay label={processing}/>
    {authOpen&&<AuthModal onClose={()=>setAuthOpen(false)} onAuth={async acc=>{
      setUser(acc);setAuthOpen(false);
      const d=await sgetAll();setRaw(d);
      notify("Signed in as "+(acc.displayName||acc.username)+".",V.goldL);
    }}/>}

    <div style={{background:`linear-gradient(180deg,${V.navy},${V.bg2})`,borderBottom:`2px solid ${V.gold}55`}}>
      <div style={{maxWidth:1080,margin:"0 auto",padding:"0.8rem 1.2rem",display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
        <a href="vindex.html" className="mono" style={{fontSize:8,letterSpacing:"0.1em",color:V.textD,textDecoration:"none",
          border:`1px solid ${V.line}`,borderRadius:2,padding:"4px 9px",flexShrink:0}}>← GOV PORTAL</a>
        <Seal size={44}/>
        <div style={{flex:1,minWidth:170}}>
          <div className="pf" style={{fontWeight:900,fontSize:16.5,letterSpacing:"0.05em",color:V.text,lineHeight:1.1}}>Department of Defense</div>
          <div className="mono" style={{fontSize:8,letterSpacing:"0.3em",color:V.gold,marginTop:2}}>REPUBLIC OF VINDEX NATION · SI VIS PACEM</div>
        </div>
        {user?<div style={{display:"flex",alignItems:"center",gap:10}}>
          <Face account={user} size={30}/>
          <div style={{textAlign:"right",lineHeight:1.25}}>
            <div className="pf" style={{fontWeight:700,fontSize:12.5,color:V.text}}>{user.displayName||user.username}</div>
            <div className="mono" style={{fontSize:7.5,letterSpacing:"0.14em",color:access?V.goldL:V.textDD}}>{myTitle.toUpperCase()}</div>
          </div>
          <Btn small variant="ghost" onClick={()=>{forgetSession();setUser(null);setTab("home");notify("Signed out.",V.textD);}}>Sign out</Btn>
        </div>:<Btn small variant="gold" onClick={()=>setAuthOpen(true)}>Sign In</Btn>}
      </div>
      <div style={{maxWidth:1080,margin:"0 auto",padding:"0 1.2rem",display:"flex",overflowX:"auto"}}>
        {TABS.map(t=>(<button key={t.v} onClick={()=>setTab(t.v)} className="pf"
          style={{fontWeight:700,fontSize:11.5,letterSpacing:"0.12em",textTransform:"uppercase",padding:"0.7rem 1rem",
            background:"transparent",border:"none",cursor:"pointer",whiteSpace:"nowrap",
            borderBottom:`3px solid ${tab===t.v?V.gold:"transparent"}`,color:tab===t.v?V.goldL:V.textD}}>{t.l}</button>))}
      </div>
    </div>

    <div style={{maxWidth:1080,margin:"0 auto",padding:"1.6rem 1.2rem 3rem"}}>
      {(!loaded||restoring)&&<div style={{textAlign:"center",padding:"4rem"}}>
        <div className="mono" style={{fontSize:10,letterSpacing:"0.35em",color:V.textDD,animation:"pulse 1.4s infinite"}}>LOADING…</div></div>}
      {loaded&&!restoring&&<>
        {tab==="home"&&<HomeTab user={user} gov={gov} dod={dod} accounts={accounts} personnel={personnel}
          assets={assets} operations={operations} commands={commands}/>}
        {tab==="personnel"&&access&&<PersonnelTab user={user} gov={gov} dod={dod} personnel={personnel} commands={commands}
          accounts={accounts} citizens={citizens} canManage={canManage} onAction={onAction} notify={notify} setProcessing={setProcessing}/>}
        {tab==="commands"&&access&&<CommandsTab commands={commands} personnel={personnel} canManage={canManage}
          onAction={onAction} notify={notify} setProcessing={setProcessing}/>}
        {tab==="assets"&&access&&<AssetsTab assets={assets} commands={commands} canManage={canManage}
          onAction={onAction} notify={notify} setProcessing={setProcessing}/>}
        {tab==="operations"&&access&&<OperationsTab operations={operations} commands={commands} user={user}
          canManage={canManage} onAction={onAction} notify={notify} setProcessing={setProcessing}/>}
        {tab==="secretary"&&(canAppointHere||canManage)&&<SecretaryTab user={user} gov={gov} dod={dod} accounts={accounts}
          citizens={citizens} personnel={personnel} canAppointHere={canAppointHere}
          onAction={onAction} notify={notify} setProcessing={setProcessing}/>}

        {!user&&<div style={{background:V.panel,border:`1px solid ${V.line}`,borderRadius:4,padding:"1.1rem 1.2rem",marginTop:"1.6rem"}}>
          <div style={{fontSize:13.5,color:V.textD,fontStyle:"italic",lineHeight:1.7}}>
            Sign in to see the Department's personnel, order of battle, assets and operations.
          </div>
        </div>}
        {user&&!access&&<div style={{background:V.panel,border:`1px solid ${V.line}`,borderRadius:4,padding:"1.1rem 1.2rem",marginTop:"1.6rem"}}>
          <div style={{fontSize:13.5,color:V.textD,fontStyle:"italic",lineHeight:1.7}}>
            You hold no appointment in the Department of Defense. Its records are open to the National Command
            Authority, the Joint Staff, and those serving in the armed forces.
          </div>
        </div>}
      </>}
    </div>

    <div style={{borderTop:`1px solid ${V.line}`,padding:"1.1rem 1.2rem 1.5rem"}}>
      <div style={{maxWidth:1080,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",gap:16,flexWrap:"wrap"}}>
        <div className="mono" style={{fontSize:8.5,letterSpacing:"0.26em",color:V.textDD}}>DEPARTMENT OF DEFENSE · REPUBLIC OF VINDEX NATION</div>
        <div className="mono" style={{fontSize:8.5,letterSpacing:"0.2em",color:V.textDD}}>
          <a href="vindex.html" style={{color:V.textD,textDecoration:"none"}}>GOVERNMENT PORTAL</a>
        </div>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
